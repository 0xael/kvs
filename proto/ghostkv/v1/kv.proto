syntax = "proto3";
package ghostkv.v1;
option go_package = "github.com/alyelalwany/ghostkv/gen/ghostkv/v1";

message PutRequest {
  string key = 1;
  bytes value = 2;
}

message PutResponse {
  int32 acks = 1;
}

message GetRequest {
  string key = 1;
}

message GetResponse {
  bytes value = 1;
  bool found = 2;
  int64 timestamp = 3;
}

message DeleteRequest {
  string key = 1;
}

message DeleteResponse {
  bool deleted = 1;
}

message StatusRequest {}

message NodeInfo {
  string node_id = 1;
  string address = 2;
  bool healthy = 3;
  int32 virtual_nodes = 4;
  int64 key_count = 5;
}

message StatusResponse {
  repeated NodeInfo nodes = 1;
  int32 replication_factor = 2;
  int32 write_quorum = 3;
  int32 read_quorum = 4;
}

service KVService {
  rpc Put(PutRequest) returns (PutResponse);
  rpc Get(GetRequest) returns (GetResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
  rpc Status(StatusRequest) returns (StatusResponse);
}
